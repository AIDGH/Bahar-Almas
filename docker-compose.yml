services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bahar_almas
      POSTGRES_USER: bahar_almas
      POSTGRES_PASSWORD: bahar_almas_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahar_almas -d bahar_almas"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bahar_almas_postgres:/var/lib/postgresql/data

volumes:
  bahar_almas_postgres:
